name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/BrimOutlook.Tests -c Release
      - run: dotnet publish src/BrimOutlook -c Release -r win-x64 --self-contained false -o out/outlook
      - uses: actions/upload-artifact@v4
        with:
          name: brim-outlook
          path: out/outlook
