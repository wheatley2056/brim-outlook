# Bauen und testen; bei einem Tag v<Version> den fertigen Plugin-Ordner als Release-Zip anhängen
# (für die Plugin-Bibliothek von Brim, siehe catalog/ im Brim-Repository).
name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/BrimOutlook.Tests -c Release
      - run: dotnet publish src/BrimOutlook -c Release -r win-x64 --self-contained false -o out/outlook
      - uses: actions/upload-artifact@v4
        with:
          name: brim-outlook
          path: out/outlook

      # Tag und Version im plugin.json müssen gleich sein, sonst lehnt die Bibliothek das Zip ab.
      - name: Version prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content out/outlook/plugin.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "plugin.json hat Version $version, der Tag ist ${{ github.ref_name }}" }

      - name: Zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path out/outlook/* -DestinationPath out/brim-outlook.zip -Force

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" out/brim-outlook.zip --title "Outlook-Plugin ${{ github.ref_name }}" --generate-notes
